name: Daily Research Scan

on:
  schedule:
    # Runs at 11:00 UTC daily = 6 AM Toronto (EST) / 7 AM (EDT)
    - cron: '0 11 * * *'
  workflow_dispatch:  # also lets you trigger manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent/agent.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily scan $(date -u +%Y-%m-%d)"
            git push
          fi
